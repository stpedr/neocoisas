<script>

// CANVAS + VIDEO ------------------------------------------------------------
var canvas=document.getElementById("output"),ctx=canvas.getContext("2d",{alpha:true});

var videoFrame=null,videoAt=0,localVideo=null,localStream=null;
var frameNo=0,lastDraw=performance.now(),readySent=false;
function resize(){var dpr=Math.min(devicePixelRatio||1,1.5);var w=Math.max(16,Math.round(innerWidth*dpr));var h=Math.max(16,Math.round(innerHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}}
function setEmbed(on){embedded=!!on;document.body.classList.toggle("embed",embedded);}
function applyBackground(){var transparent=P.background==="transparent";document.documentElement.classList.toggle("transparent",transparent);document.body.classList.toggle("transparent",transparent);}

}

// AUDIO + REACT -------------------------------------------------------------
var A={bass:0,mid:0,high:0,level:0,energy:0,kick:0,snare:0,hat:0,beat:0,downbeat:0,bpm:0,beatPhase:0,barPhase:0};
var audioPresent={};
var eventEnv={kick:0,snare:0,hat:0,beat:0,downbeat:0};
var smooth={grain:0,red:0,contrast:0},flash=0,lastAudioAt=0,lastTriggerAt=-10,prevTrigger=0;
var audioContext=null,analyser=null,audioData=null,localEnergy=0,prevBands={bass:0,mid:0,high:0};
function val(name){if(name==="off")return 0;if(eventEnv[name]!==undefined)return eventEnv[name];if(name==="energy"&&!audioPresent.energy)return clamp(Number(A.level)||0,0,1);return clamp(Number(A[name])||0,0,1);}
function sourceFor(target,suggested,isTrigger){
  if(P.reactTo==="custom")return P["rx_"+target+"_src"];
  if(P.reactTo==="bass")return isTrigger?"kick":"bass";
  if(P.reactTo==="high")return isTrigger?"hat":"high";
  if(P.reactTo==="beat")return "beat";

}
function targetValue(name,suggested){return clamp(val(sourceFor(name,suggested,false))*P["rx_"+name+"_amt"]*P.reactAmount*P.sensitivity,0,2);}
function updateContinuous(dt){

}
function triggerImpact(strength,now){strength=clamp(strength*P.rx_flash_amt*P.reactAmount*P.sensitivity,0,2);if(strength<=0||now-lastTriggerAt<P.beatCooldown*1000)return;lastTriggerAt=now;flash=Math.max(flash,strength);post("motion:event",{name:"beat",data:{strength:strength}});}

  if(eventEnv[src]!==undefined){if(v>.02&&prevTrigger<=.02)triggerImpact(v,now);}else if(v>.62&&prevTrigger<=.62)triggerImpact(v,now);
  prevTrigger=v;
}
function feedAudio(payload){
  payload=payload||{};Object.keys(A).forEach(function(k){if(payload[k]!==undefined){A[k]=Number(payload[k])||0;audioPresent[k]=true;}});
  ["kick","snare","hat","beat","downbeat"].forEach(function(k){var v=payload[k];if(v===undefined&&k!=="beat")v=payload.beat;if((Number(v)||0)>0)eventEnv[k]=Math.max(eventEnv[k],clamp(Number(v),0,1));});

function analyseLocal(){
  if(!analyser||!audioData)return;analyser.getByteFrequencyData(audioData);var nyq=audioContext.sampleRate/2;
  function band(lo,hi){var a=Math.floor(lo/nyq*audioData.length),b=Math.max(a+1,Math.ceil(hi/nyq*audioData.length)),sum=0;for(var i=a;i<Math.min(b,audioData.length);i++)sum+=audioData[i];return sum/Math.max(1,b-a)/255;}

  localEnergy+= (level-localEnergy)*.025;var kick=Math.max(0,bass-prevBands.bass*1.2)>.12?1:0;var snare=Math.max(0,mid-prevBands.mid*1.15)>.14?1:0;var hat=Math.max(0,high-prevBands.high*1.1)>.12?1:0;
  prevBands={bass:bass,mid:mid,high:high};feedAudio({bass:bass,mid:mid,high:high,level:level,energy:localEnergy,kick:kick,snare:snare,hat:hat,beat:kick});

  var stale=now-lastAudioAt>500;if(stale&&!analyser){["bass","mid","high","level","energy"].forEach(function(k){A[k]*=Math.exp(-dt/1.2);});}
  var decay=Math.exp(-dt/Math.max(.02,P.rx_flash_smooth));Object.keys(eventEnv).forEach(function(k){eventEnv[k]*=decay;});flash*=decay;

// IMAGE EFFECT --------------------------------------------------------------
function rgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
function noise(x,y,f,seed){var n=(x*374761393+y*668265263+f*1442695041+seed*1013904223)|0;n=(n^(n>>>13))*1274126177;return ((n^(n>>>16))>>>0)/4294967295;}

  var data=img.data,red=rgb(P.redColor),grainBoost=clamp(P.grainAmount*(.3+smooth.grain),0,2),redBoost=clamp(P.redMix*(.28+smooth.red)+flash*.38,0,2),cont=P.contrast*(1+smooth.contrast*.55),levels=Math.max(2,P.posterize),step=255/(levels-1),gs=Math.max(1,P.grainSize),seed=P.seed|0;
  for(var y=0;y<h;y++)for(var x=0;x<w;x++){
    var i=(y*w+x)*4,g=(data[i]*.2126+data[i+1]*.7152+data[i+2]*.0722)*P.exposure;
    g=(g-128)*cont+128;if(g<255*P.threshold)g*=.28;g=Math.round(clamp(g,0,255)/step)*step;
    var n=(noise((x/gs)|0,(y/gs)|0,frameNo,seed)-.5)*150*grainBoost;g=clamp(g+n,0,255);

    if(mode==="monochrome")accent=flash*.38;
    data[i]=clamp(g*(1-accent)+red[0]*accent,0,255);data[i+1]=clamp(g*(1-accent)+red[1]*accent,0,255);data[i+2]=clamp(g*(1-accent)+red[2]*accent,0,255);

function render(now){

  resize();var dt=Math.min(.1,Math.max(.001,(now-lastDraw)/1000));lastDraw=now;if(!playing){requestAnimationFrame(render);return;}
  frameNo++;analyseLocal();decayAudio(dt,now);updateContinuous(dt);updateTrigger(now);

  wg.clearRect(0,0,maxW,maxH);var src=currentSource(now);if(src)drawCover(wg,src,maxW,maxH);else fallback(wg,maxW,maxH,now);
  var img=wg.getImageData(0,0,maxW,maxH);wg.putImageData(processPixels(img,maxW,maxH,now),0,0);
  if(P.background==="transparent")ctx.clearRect(0,0,canvas.width,canvas.height);else{ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);}
  ctx.imageSmoothingEnabled=false;ctx.drawImage(work,0,0,canvas.width,canvas.height);
  var scanPhase=P.tempoSync&&A.bpm>0?A.barPhase:((now*.00008*(.25+P.idleMotion)+P.seed*.001)%1);ctx.save();ctx.globalCompositeOperation="multiply";ctx.fillStyle="rgba(0,0,0,"+clamp(P.scanlines*.34,0,.6)+")";for(var sy=Math.floor(scanPhase*6);sy<canvas.height;sy+=6)ctx.fillRect(0,sy,canvas.width,2);ctx.restore();
  if(flash>.02){ctx.fillStyle="rgba(255,255,255,"+clamp(flash*.16,0,.38)+")";ctx.fillRect(0,0,canvas.width,canvas.height);}
  if(!readySent){readySent=true;post("motion:ready",{manifest:MANIFEST});}
  requestAnimationFrame(render);
}

// STATE + API ---------------------------------------------------------------
var stateQueued=false;
function post(type,payload){if(window.parent&&window.parent!==window)try{window.parent.postMessage({type:type,payload:payload||{}},"*");}catch(_e){}}

function trigger(id){if(id==="strike")triggerImpact(1,performance.now());else if(id==="invert")setMode(mode==="negative"?"crimson":"negative");else if(id==="reset"){mode=MANIFEST.defaultMode;flash=0;smooth={grain:0,red:0,contrast:0};queueState();}}
function init(payload){payload=payload||{};if(payload.embed)setEmbed(true);if(payload.params)setParams(payload.params);if(payload.mode)setMode(payload.mode);playing=true;post("motion:ready",{manifest:MANIFEST});queueState();}
function destroy(){destroyed=true;playing=false;if(videoFrame&&videoFrame.close)videoFrame.close();videoFrame=null;if(localStream)localStream.getTracks().forEach(function(t){t.stop();});if(audioContext)audioContext.close();localStream=null;audioContext=null;analyser=null;}
window.addEventListener("message",function(e){
  if(e.source!==window.parent||!e.data||typeof e.data.type!=="string")return;var p=e.data.payload||{};
  if(e.data.type==="motion:init")init(p);else if(e.data.type==="motion:setParams")setParams(p);else if(e.data.type==="motion:setMode")setMode(p.mode);else if(e.data.type==="motion:trigger")trigger(p.id);else if(e.data.type==="motion:play"){playing=true;queueState();}else if(e.data.type==="motion:pause"){playing=false;queueState();}else if(e.data.type==="motion:audio")feedAudio(p);else if(e.data.type==="motion:video"&&p.frame){if(videoFrame&&videoFrame.close)videoFrame.close();videoFrame=p.frame;videoAt=performance.now();}else if(e.data.type==="motion:destroy")destroy();
});
window.MotionModule={spec:"motion-module/1",getManifest:function(){return MANIFEST;},getState:getState,init:init,setParams:setParams,setMode:setMode,trigger:trigger,play:function(){playing=true;},pause:function(){playing=false;},feedAudio:feedAudio,destroy:destroy};

// STANDALONE UI -------------------------------------------------------------
document.getElementById("activate").addEventListener("click",async function(){
  var status=document.getElementById("status");try{localStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:true});localVideo=document.createElement("video");localVideo.muted=true;localVideo.playsInline=true;localVideo.srcObject=localStream;await localVideo.play();audioContext=new (window.AudioContext||window.webkitAudioContext)();analyser=audioContext.createAnalyser();analyser.fftSize=1024;audioData=new Uint8Array(analyser.frequencyBinCount);audioContext.createMediaStreamSource(localStream).connect(analyser);status.textContent="Câmera e microfone ativos.";}catch(err){status.textContent="Não foi possível abrir câmera/microfone: "+(err&&err.message?err.message:String(err));post("motion:error",{message:status.textContent});}
});
canvas.addEventListener("pointerdown",function(){if(P.interactive)triggerImpact(1,performance.now());});
window.addEventListener("resize",resize);window.addEventListener("beforeunload",destroy);
window.addEventListener("error",function(e){post("motion:error",{message:String(e.message||e.error||"Erro no motion")});});
window.addEventListener("unhandledrejection",function(e){post("motion:error",{message:String(e.reason&&e.reason.message||e.reason||"Promise rejeitada")});});
var nativeConsoleError=console.error.bind(console);console.error=function(){nativeConsoleError.apply(console,arguments);post("motion:error",{message:Array.prototype.map.call(arguments,String).join(" ")});};
paramsFromUrl();applyBackground();resize();requestAnimationFrame(render);
})();
</script>
