# Auto Niche Engine — stack completa em Docker.
#
#   docker compose up -d --build
#
# Serviços:
#   - ollama : servidor de LLM local (baixa o modelo no primeiro start)
#   - api    : FastAPI (server.py) — aponta para o ollama do compose
#   - web    : frontend Next.js
#
# Acesso:  web  -> http://localhost:3000
#          api  -> http://localhost:8000/api/health
#
# Modelo: defina OLLAMA_MODEL (padrão llama3). Ex.: OLLAMA_MODEL=llama3 docker compose up -d
# GPU NVIDIA: descomente o bloco `deploy` do serviço ollama (requer NVIDIA Container Toolkit).

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ane-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    # --- GPU NVIDIA (opcional) ---------------------------------------------
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Baixa o modelo uma vez, quando o ollama fica saudável.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3}"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ane-api
    ports:
      - "8000:8000"
    environment:
      ANE_OLLAMA_BASE_URL: http://ollama:11434
      ANE_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      ANE_TEXT_PROVIDER: ${ANE_TEXT_PROVIDER:-ollama}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-1.5-flash}
      ANE_CORS_ORIGINS: http://localhost:3000
      ANE_QUEUE: /app/output/review_queue.json
      ANE_BOARD: /app/output/board.json
      ANE_OUTPUT_DIR: /app/output
      ANE_API_KEY: ${ANE_API_KEY:-}
      # Provedores de mídia/publicação (padrão: placeholder / sem publicação).
      ANE_IMAGE_PROVIDER: ${ANE_IMAGE_PROVIDER:-placeholder}
      ANE_VOICE_PROVIDER: ${ANE_VOICE_PROVIDER:-placeholder}
      PIPER_MODEL: ${PIPER_MODEL:-/app/voices/pt_BR-faber-medium.onnx}
      ANE_VIDEO_PROVIDER: ${ANE_VIDEO_PROVIDER:-none}
      ANE_BURN_SUBTITLES: ${ANE_BURN_SUBTITLES:-true}
      ANE_PUBLISHER: ${ANE_PUBLISHER:-none}
      # Chaves opcionais (passadas do host; vazias por padrão).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-imagen-4.0-fast-generate-001}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-veo-3.1-fast-generate-preview}
      STABILITY_API_KEY: ${STABILITY_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
    volumes:
      - ane_output:/app/output
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_KEY: ${ANE_API_KEY:-}
    container_name: ane-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Bot do Telegram (opt-in): sobe com `docker compose --profile bot up -d`.
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: ane-bot
    profiles: ["bot"]
    environment:
      PYTHONUNBUFFERED: "1"
      ANE_API_URL: http://api:8000
      ANE_API_KEY: ${ANE_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_NOTIFY_CHAT_ID: ${TELEGRAM_NOTIFY_CHAT_ID:-}
      TELEGRAM_NOTIFY_INTERVAL: ${TELEGRAM_NOTIFY_INTERVAL:-120}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_models:
  ane_output:
