<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Teste AV (ProjMap)</title>
<script type="application/json" id="motion-manifest">
{
  "spec": "motion-module/1",
  "id": "projmap-teste-av",
  "name": "Teste AV",
  "version": "1.0.0",
  "description": "Motion de verificação: marcador verde, vídeo de entrada no centro, graves em barra e flash na batida.",
  "tags": ["teste"],
  "modes": [{ "id": "default", "label": "Padrão" }],
  "defaultMode": "default",
  "audio": { "internal": [], "external": true },
  "video": { "input": true },
  "params": [
    { "id": "background", "label": "Fundo", "type": "select", "group": "Cena", "default": "black",
      "options": [{ "value": "black", "label": "Preto" }, { "value": "transparent", "label": "Transparente" }] },
    { "id": "flash", "label": "Flash na batida", "type": "float", "group": "Reação ao áudio", "default": 1, "min": 0, "max": 1 }
  ],
  "triggers": [],
  "events": ["beat"]
}
</script>
<style>:root{color-scheme:normal}html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// LOOP mínimo: tudo em canvas 2D (sem CDN), para os testes não dependerem da rede.
(function () {
  var cv = document.getElementById("c"), g = cv.getContext("2d");
  var P = { background: "black", flash: 1 };
  var audio = { bass: 0, beat: 0 }, env = 0, video = null, last = performance.now();
  function size() { cv.width = window.innerWidth || 640; cv.height = window.innerHeight || 360; }
  size(); window.addEventListener("resize", size);
  function post(type, payload) { window.parent.postMessage({ type: type, payload: payload || {} }, "*"); }
  window.addEventListener("message", function (e) {
    if (e.source !== window.parent || !e.data || typeof e.data.type !== "string") return;
    var p = e.data.payload || {};
    if (e.data.type === "motion:init") { if (p.params) for (var k in p.params) if (k in P) P[k] = p.params[k]; post("motion:ready", { manifest: { id: "projmap-teste-av" } }); }
    else if (e.data.type === "motion:setParams") { for (var k2 in p) if (k2 in P) P[k2] = p[k2]; }
    else if (e.data.type === "motion:audio") { audio = p; if (p.beat > 0) { env = 1; post("motion:event", { name: "beat", data: { strength: p.beat } }); } }
    else if (e.data.type === "motion:video" && p.frame) { if (video && video.close) video.close(); video = p.frame; }
  });
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    env = Math.max(0, env - dt / 0.25);
    var w = cv.width, h = cv.height;
    var f = Math.round(255 * env * P.flash);
    g.fillStyle = "rgb(" + f + "," + f + "," + f + ")";
    g.fillRect(0, 0, w, h);
    g.fillStyle = "#00ff00"; g.fillRect(0, 0, Math.round(w / 16), Math.round(h / 9));      // marcador
    if (video) g.drawImage(video, w / 4, h / 4, w / 2, h / 2);                              // entrada de vídeo
    else { g.fillStyle = "#282828"; g.fillRect(w / 4, h / 4, w / 2, h / 2); }
    g.fillStyle = "#ff0000"; g.fillRect(0, h - Math.round(h / 12), Math.round(w * Math.min(1, audio.bass || 0)), Math.round(h / 12));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.MotionModule = { spec: "motion-module/1", getManifest: function () { return { id: "projmap-teste-av" }; } };
})();
</script>
</body>
</html>
